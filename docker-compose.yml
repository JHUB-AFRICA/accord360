services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: accord360
      POSTGRES_USER: accord360
      POSTGRES_PASSWORD: accord360_change_me
    volumes:
      - accord360_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accord360"]
      interval: 5s
      timeout: 5s
      retries: 10

  accord-backend:
    build: ./backend
    environment:
      APP_NAME: Accord 360
      ENVIRONMENT: development
      SECRET_KEY: change-this-in-production-use-at-least-32-characters
      DB_HOST: database
      DB_PORT: "5432"
      DB_USER: accord360
      DB_PASSWORD: accord360_change_me
      DB_NAME: accord360
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: http://localhost:8080
      SEED_DEMO_DATA: "false"
      # The root compose stack is used for demos; expose the role-based signup flow.
      ALLOW_DEMO_SIGNUP: "true"
    volumes:
      - accord360_uploads:/app/uploads
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    depends_on:
      - accord-backend
    ports:
      - "8080:80"

volumes:
  accord360_postgres:
  accord360_uploads:
