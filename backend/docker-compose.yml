services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-accord360}
      POSTGRES_USER: ${POSTGRES_USER:-accord360}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-accord360_dev_password}
    volumes:
      - accord360_postgres:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # S3-compatible storage (MinIO's public images were withdrawn; RustFS speaks the same S3 API).
  objectstore:
    image: rustfs/rustfs:1.0.6
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:-accord360}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
    volumes:
      - accord360_objects:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Accord 360}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SECRET_KEY: ${SECRET_KEY:-change-this-before-production-use-at-least-32-characters}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-accord360}:${POSTGRES_PASSWORD:-accord360_dev_password}@database:5432/${POSTGRES_DB:-accord360}
      UPLOAD_DIR: /app/uploads
      OBJECT_STORAGE_ENABLED: ${OBJECT_STORAGE_ENABLED:-true}
      AWS_ENDPOINT_URL_S3: ${AWS_ENDPOINT_URL_S3:-http://objectstore:9000}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-accord360}}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-change-this-minio-password}}
      AWS_REGION: ${AWS_REGION:-us-east-2}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-accord-360}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      EMAIL_FROM: ${EMAIL_FROM:-notifications@example.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Accord 360}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_API_URL: ${RESEND_API_URL:-https://api.resend.com/emails}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      GOOGLE_DRIVE_ENABLED: ${GOOGLE_DRIVE_ENABLED:-false}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
      GOOGLE_DRIVE_DEMO_DOC_ID: ${GOOGLE_DRIVE_DEMO_DOC_ID:-}
      DRIVE_ACCESS_SWEEP_MINUTES: ${DRIVE_ACCESS_SWEEP_MINUTES:-2}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - accord360_uploads:/app/uploads
    depends_on:
      database:
        condition: service_healthy
      objectstore:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  accord360_postgres:
  accord360_uploads:
  accord360_objects:
