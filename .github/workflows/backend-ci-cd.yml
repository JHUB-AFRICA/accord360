name: Accord360 CI/CD

on:
  pull_request:
    paths:
      - "backend/app/**"
      - "backend/migrations/**"
      - "backend/tests/**"
      - "backend/requirements.txt"
      - "backend/Dockerfile"
      - "backend/.dockerignore"
      - "backend/alembic.ini"
      - "frontend/src/**"
      - "frontend/scripts/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/Dockerfile"
      - "frontend/.dockerignore"
      - "frontend/nginx.conf"
      - "frontend/.env.example"
      - ".github/workflows/backend-ci-cd.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accord360-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-test:
    name: Test backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci_accord360.db
          UPLOAD_DIR: ./ci_uploads
          ENVIRONMENT: test
          SEED_DEMO_DATA: "true"
        run: python -m pytest -q

  frontend-check:
    name: Check frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run verification gate
        working-directory: frontend
        run: npm run check

  publish-images:
    name: Publish ${{ matrix.app }} image
    if: github.ref == 'refs/heads/main'
    needs:
      - backend-test
      - frontend-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - app: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/accord360-${{ matrix.app }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
